<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booth Buddy Help</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="apple-touch-icon" href="images/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#FF6B9D; --pink-dark:#D6497A; --pink-light:#FFE3ED;
    --blue:#4FC3F7; --blue-dark:#1E93C6; --blue-light:#E3F6FF;
    --yellow:#FFD93D; --yellow-dark:#E0AC00; --yellow-light:#FFF3C4;
    --purple:#9B5DE5; --purple-dark:#7333BE; --purple-light:#F3E9FF;
    --green:#4CD787; --green-dark:#1FA85C; --green-light:#E4FBEE;
    --red:#FF6B6B; --red-dark:#E14545; --red-light:#FFEDED;
    --cream:#FFFDF6;
    --ink:#2B2340;
    --ink-soft:#6E6480;
    --bg:#EDE9F5;
    --card-bg:#F3E9FF;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; background:var(--bg); font-family:'Nunito',sans-serif; color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{ font-family:'Fredoka',sans-serif; margin:0; font-weight:600; color:var(--ink); }
  p{ margin:0 0 12px; line-height:1.55; font-weight:600; color:var(--ink); }
  a{ color:var(--purple-dark); text-decoration:none; }
  a:hover{ text-decoration:underline; }
  ul{ margin:0 0 12px; padding-left:20px; }
  li{ margin-bottom:6px; font-weight:600; line-height:1.5; }
  button{ font-family:inherit; cursor:pointer; }

  /* ===== layout shell ===== */
  .shell{ display:flex; min-height:100vh; max-width:1180px; margin:0 auto; }
  .sidebar{
    width:270px; flex-shrink:0; padding:22px 16px 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
  }
  .brand{ display:flex; align-items:center; gap:10px; padding:4px 8px 18px; }
  .brand .logo{ display:flex; align-items:center; flex-shrink:0; }
  .brand .logo img{
    width:40px; height:40px; border-radius:12px; display:block;
    box-shadow:0 2px 6px rgba(43,35,64,0.1);
  }
  .brand .word{ font-family:'Fredoka'; font-size:19px; font-weight:600; }
  .brand .sub{ display:block; font-family:'Nunito'; font-size:11px; font-weight:800; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; margin-top:1px; }
  .mobilebar .brand .logo img{ width:28px; height:28px; border-radius:8px; }

  .search-wrap{ padding:0 8px 16px; }
  .search-wrap input{
    width:100%; border:none; border-radius:14px; padding:11px 14px; font-family:'Nunito'; font-weight:700;
    font-size:13px; background:#fff; color:var(--ink); outline:none; box-shadow:0 1px 3px rgba(43,35,64,0.08);
  }
  .search-wrap input::placeholder{ color:var(--ink-soft); }

  .navgroup{ margin-bottom:16px; }
  .navgroup-title{
    font-family:'Fredoka',sans-serif; font-size:14px; font-weight:600; color:var(--ink);
    text-transform:uppercase; letter-spacing:0.4px;
    padding:4px 10px 8px; margin-bottom:4px; display:flex; align-items:center; gap:6px;
  }
  .navgroup-title .ui-icon{ color:var(--ink); width:16px; height:16px; }
  .navlink{
    display:flex; align-items:center; gap:9px; padding:11px 10px; border-radius:0; font-size:13.5px;
    font-weight:800; color:var(--ink); margin-bottom:0;
    background:#fff; border-bottom:1px solid #E4DDF5;
  }
  .navlink:hover{ background:var(--purple-light); text-decoration:none; }
  .navlink.active{ background:var(--purple); color:#fff; border-bottom-color:var(--purple-dark); }
  .navlink .ic{ font-size:15px; width:18px; text-align:center; flex-shrink:0; }
  /* Indent items under For staff / For owners group titles */
  .navgroup:has(> .navgroup-title) > .navlink{ padding-left:26px; }
  .navlink .tag{
    margin-left:auto; font-size:9px; font-weight:900; padding:2px 6px; border-radius:8px; flex-shrink:0;
  }
  .tag-staff{ background:var(--pink-light); color:var(--pink-dark); }
  .tag-owner{ background:var(--purple-light); color:var(--purple-dark); }
  .tag-everyone{ background:var(--blue-light); color:var(--blue-dark); }
  .navlink.active .tag-staff{ background:#fff; color:var(--pink-dark); }
  .navlink.active .tag-owner{ background:#fff; color:var(--purple-dark); }
  .navlink.active .tag-everyone{ background:#fff; color:var(--blue-dark); }

  .faq-sub{ padding-left:22px; }
  .faq-toggle{ display:flex; align-items:center; gap:9px; padding:9px 10px; border-radius:12px; font-size:13.5px; font-weight:800; width:100%; background:none; border:none; text-align:left; color:var(--ink); }
  .faq-toggle:hover{ background:#fff; }
  .faq-toggle .chev{ margin-left:auto; font-size:11px; color:var(--ink-soft); transition:transform .15s; }
  .faq-toggle.open .chev{ transform:rotate(90deg); }
  .faq-sub{ display:none; }
  .faq-sub.open{ display:block; }

  .sidebar-hide{ display:none; }

  /* ===== main ===== */
  .main{ flex:1; min-width:0; padding:26px 34px 80px; }
  .mobilebar{ display:none; }

  .crumbs{ font-size:12px; font-weight:800; color:var(--ink-soft); margin-bottom:14px; }
  .crumbs a{ color:var(--ink-soft); }
  .crumbs a:hover{ color:var(--purple-dark); }

  .page-head{ display:flex; align-items:flex-start; gap:14px; margin-bottom:22px; flex-wrap:wrap; }
  .page-head .emoji{
    width:52px; height:52px; border-radius:16px; background:#fff; display:flex; align-items:center; justify-content:center;
    font-size:26px; flex-shrink:0; box-shadow:0 2px 6px rgba(43,35,64,0.08);
  }
  .page-head h1{ font-size:28px; }
  .badge-row{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  .audience-badge{
    display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:900; padding:4px 10px 4px 8px;
    border-radius:999px; text-transform:uppercase; letter-spacing:0.3px;
  }
  .audience-badge.staff{ background:var(--pink-light); color:var(--pink-dark); }
  .audience-badge.owner{ background:var(--purple-light); color:var(--purple-dark); }
  .audience-badge.everyone{ background:var(--blue-light); color:var(--blue-dark); }

  .card{ background:#fff; border-radius:20px; padding:20px 22px; margin-bottom:18px; box-shadow:0 2px 10px rgba(43,35,64,0.06); }
  .card h2{ font-size:19px; margin-bottom:10px; }
  .card h3{ font-size:15px; margin:14px 0 8px; color:var(--purple-dark); }
  .card:last-child{ margin-bottom:0; }

  .section-audience-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .section-audience-head h2{ font-size:17px; }

  .steps{ list-style:none; margin:0 0 6px; padding:0; counter-reset:step; }
  .steps li{
    display:flex; gap:12px; align-items:flex-start; background:var(--cream); border-radius:14px; padding:12px 14px;
    margin-bottom:8px; font-weight:700; font-size:14px; line-height:1.5;
  }
  .steps li .num{
    counter-increment:step; content:counter(step); flex-shrink:0; width:26px; height:26px; border-radius:50%;
    background:var(--purple); color:#fff; font-family:'Fredoka'; font-weight:600; font-size:13px;
    display:flex; align-items:center; justify-content:center; margin-top:1px;
  }
  .steps li .txt b{ color:var(--purple-dark); }
  .steps li .note{ display:block; margin-top:4px; font-size:12.5px; font-weight:700; color:var(--ink-soft); }

  .callout{ border-radius:14px; padding:12px 14px; margin:10px 0; font-weight:700; font-size:13.5px; display:flex; gap:10px; align-items:flex-start; }
  .callout .ic{ font-size:17px; flex-shrink:0; }
  .callout-tip{ background:var(--yellow-light); color:#7a5b00; }
  .callout-warn{ background:var(--red-light); color:var(--red-dark); }
  .callout-info{ background:var(--blue-light); color:var(--blue-dark); }
  .callout-soon{ background:var(--purple-light); color:var(--purple-dark); }

  .pill-btn{
    display:inline-flex; align-items:center; gap:6px; font-family:'Fredoka'; font-weight:600; font-size:12.5px;
    padding:6px 12px; border-radius:999px; color:#fff; white-space:nowrap;
  }
  .pill-purple{ background:var(--purple); }
  .pill-green{ background:var(--green); }
  .pill-blue{ background:var(--blue); }
  .pill-pink{ background:var(--pink); }
  .pill-white{ background:#fff; color:var(--ink); box-shadow:0 1px 3px rgba(43,35,64,0.12); }

  .rows{ display:flex; flex-direction:column; gap:8px; margin:10px 0; }
  .row-item{ background:var(--purple-light); border-radius:14px; padding:11px 14px; display:flex; align-items:center; gap:12px; }
  .row-item .r-ic{ font-size:18px; flex-shrink:0; }
  .row-item .r-body{ flex:1; min-width:0; }
  .row-item .r-title{ font-weight:900; font-size:13.5px; }
  .row-item .r-desc{ font-size:12.5px; color:var(--ink-soft); font-weight:700; margin-top:1px; }

  .glossary-row{ background:var(--cream); border-radius:14px; padding:12px 14px; margin-bottom:8px; }
  .glossary-row .term{ font-family:'Fredoka'; font-weight:600; font-size:14px; color:var(--purple-dark); }
  .glossary-row .def{ font-size:13px; font-weight:700; color:var(--ink-soft); margin-top:2px; }

  .link-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px; margin-top:8px; }
  .link-card{
    background:#fff; border-radius:18px; padding:16px 16px; display:flex; flex-direction:column; gap:6px;
    box-shadow:0 2px 8px rgba(43,35,64,0.07); border:2px solid transparent;
  }
  .link-card:hover{ border-color:var(--purple); text-decoration:none; }
  .link-card .lc-top{ display:flex; align-items:center; gap:8px; }
  .link-card .lc-ic{ font-size:20px; }
  .link-card .lc-title{ font-family:'Fredoka'; font-weight:600; font-size:14.5px; color:var(--ink); }
  .link-card .lc-desc{ font-size:12.5px; color:var(--ink-soft); font-weight:700; }

  .faq-list{ display:flex; flex-direction:column; gap:8px; }
  .faq-list a{
    display:flex; align-items:center; gap:10px; background:#fff; border-radius:14px; padding:12px 14px;
    font-weight:800; font-size:13.5px; color:var(--ink); box-shadow:0 2px 6px rgba(43,35,64,0.05);
  }
  .faq-list a:hover{ text-decoration:none; background:var(--purple-light); }
  .faq-list a .chev{ margin-left:auto; color:var(--ink-soft); }

  .hero{
    background:linear-gradient(135deg,var(--pink),var(--purple)); border-radius:26px; padding:32px 28px;
    color:#fff; margin-bottom:22px; text-align:center;
  }
  .hero .kicker{ font-size:12px; font-weight:900; opacity:0.85; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
  .hero h1{ color:#fff; font-size:32px; margin-bottom:8px; }
  .hero p{ color:#fff; opacity:0.95; font-size:15px; max-width:520px; margin:0 auto; }

  .who-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:20px 0; }
  .who-card{ border-radius:20px; padding:20px; color:#fff; }
  .who-card.staff{ background:linear-gradient(135deg,var(--pink),var(--pink-dark)); }
  .who-card.owner{ background:linear-gradient(135deg,var(--purple),var(--purple-dark)); }
  .who-card h3{ color:#fff; font-size:16px; margin-bottom:4px; }
  .who-card p{ color:#fff; opacity:0.9; font-size:13px; margin-bottom:12px; }
  .who-card a{ color:#fff; font-weight:900; font-size:12.5px; background:rgba(255,255,255,0.22); padding:7px 12px; border-radius:999px; display:inline-block; }
  .who-card a:hover{ text-decoration:none; background:rgba(255,255,255,0.34); }

  .checklist-group{ margin-bottom:16px; }
  .checklist-group h3{ font-size:14px; color:var(--purple-dark); margin-bottom:8px; }
  .chk-row{ display:flex; align-items:center; gap:10px; background:var(--cream); border-radius:12px; padding:10px 12px; margin-bottom:6px; font-weight:700; font-size:13.5px; }
  .chk-box{ width:22px; height:22px; border-radius:7px; border:2px solid var(--purple); flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; }
  .chk-row.done .chk-box{ background:var(--purple); }
  .chk-row.done span.chk-label{ text-decoration:line-through; color:var(--ink-soft); }

  .footer-nav{ margin-top:26px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding-top:18px; border-top:2px solid #E4DDF5; }
  .footer-nav .fn-left{ display:flex; gap:10px; flex-wrap:wrap; }
  .glossary-link{
    display:inline-flex; align-items:center; gap:6px; background:#fff; border-radius:999px; padding:8px 14px;
    font-weight:900; font-size:12.5px; color:var(--purple-dark); box-shadow:0 2px 6px rgba(43,35,64,0.06); border:none;
  }
  .glossary-link:hover{ background:var(--purple-light); }
  .home-link{ font-weight:900; font-size:12.5px; color:var(--ink-soft); }

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(43,35,64,0.55); display:none; align-items:center; justify-content:center;
    padding:20px; z-index:50;
  }
  .modal-overlay.open{ display:flex; }
  .modal-card{
    width:100%; max-width:460px; max-height:80vh; overflow-y:auto; background:var(--bg); border-radius:26px;
    padding:24px 22px; box-shadow:0 16px 40px rgba(43,35,64,0.3);
  }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .modal-head h2{ font-size:19px; }
  .modal-close{ width:32px; height:32px; border-radius:50%; background:#fff; border:none; font-size:15px; font-weight:800; color:var(--ink-soft); flex-shrink:0; }
  .modal-close:hover{ background:var(--red-light); color:var(--red-dark); }

  .menu-toggle{
    display:none; width:40px; height:40px; border-radius:12px; background:#fff; border:none; font-size:18px;
    align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(43,35,64,0.08);
  }

  /* mobile */
  @media (max-width: 880px){
    .shell{ flex-direction:column; }
    .sidebar{
      position:fixed; top:0; left:0; height:100vh; width:270px; background:var(--bg); z-index:40; box-shadow:2px 0 16px rgba(43,35,64,0.18);
      transform:translateX(-105%); transition:transform .2s ease; display:flex; flex-direction:column;
    }
    .sidebar.open{ transform:translateX(0); }
    .mobilebar{
      display:flex; align-items:center; justify-content:space-between; padding:16px 18px; position:sticky; top:0;
      background:var(--bg); z-index:20;
    }
    .menu-toggle{ display:flex; }
    .main{ padding:8px 18px 70px; }
    .who-grid{ grid-template-columns:1fr; }
    .page-head h1{ font-size:23px; }
    .hero h1{ font-size:25px; }
  }

  ::-webkit-scrollbar{ width:9px; }
  ::-webkit-scrollbar-thumb{ background:#D3C8EE; border-radius:8px; }

  /* Lucide UI icons — match app UiIcon (20–24px, stroke 2.5) */
  .ui-icon{
    display:inline-block; vertical-align:-0.2em; flex-shrink:0;
    width:22px; height:22px; stroke-width:2.5; color:var(--ink);
  }
  .ui-icon.soft{ color:var(--ink-soft); }
  .ui-icon.on-dark, .navlink.active .ui-icon, .who-card .ui-icon,
  .pill-btn .ui-icon, .hero .ui-icon{ color:currentColor; }
  .navlink .ui-icon, .faq-toggle .ui-icon{ width:20px; height:20px; color:var(--ink); }
  .navlink.active .ui-icon{ color:#fff; }
  .page-head .emoji .ui-icon{ width:26px; height:26px; }
  .brand .logo .ui-icon{ width:24px; height:24px; color:var(--purple); }
  .brand-mark{
    display:inline-block; vertical-align:-0.25em; flex-shrink:0;
    width:22px; height:22px; border-radius:6px; object-fit:cover;
  }
  .brand-mark.lg{ width:28px; height:28px; border-radius:8px; }
  .page-head .emoji .brand-mark{ width:32px; height:32px; border-radius:10px; }
  .navlink .brand-mark{ width:20px; height:20px; border-radius:5px; }
  .crumbs .brand-mark{ width:14px; height:14px; border-radius:4px; vertical-align:-0.15em; }
  .hero .brand-mark{ width:36px; height:36px; border-radius:10px; vertical-align:-0.35em; margin-right:4px; }
  .row-item .r-ic .ui-icon{ width:20px; height:20px; }
  .callout .ic .ui-icon{ width:20px; height:20px; }
  .callout-tip .ui-icon{ color:#7a5b00; }
  .callout-warn .ui-icon{ color:var(--red-dark); }
  .callout-info .ui-icon{ color:var(--blue-dark); }
  .callout-soon .ui-icon{ color:var(--purple-dark); }
  .search-wrap{ position:relative; }
  .search-wrap .search-ic{
    position:absolute; left:20px; top:50%; transform:translateY(-50%);
    pointer-events:none; color:var(--ink-soft); width:18px; height:18px;
  }
  .search-wrap input{ padding-left:40px; }
  .link-card .lc-ic .ui-icon{ width:22px; height:22px; color:var(--purple-dark); }
  .section-audience-head .ui-icon{ width:22px; height:22px; color:var(--purple-dark); }
  .audience-badge .ui-icon{ width:14px; height:14px; color:inherit; }
  .crumbs .ui-icon{ width:14px; height:14px; color:inherit; vertical-align:-0.15em; }
  .glossary-link .ui-icon{ width:18px; height:18px; color:inherit; }
  .modal-head .ui-icon{ width:22px; height:22px; color:var(--purple-dark); }
  .menu-toggle .ui-icon{ width:22px; height:22px; color:var(--ink); }
  .modal-close .ui-icon{ width:16px; height:16px; color:inherit; }
  .faq-list a .ui-icon:first-child{ width:20px; height:20px; color:var(--ink); }
  .faq-list a .chev .ui-icon{ width:18px; height:18px; color:var(--ink-soft); }
  .chk-box .ui-icon{ width:14px; height:14px; color:#fff; }
  .pill-btn{ gap:6px; }
  .pill-btn .ui-icon{ width:16px; height:16px; }
</style>
<script src="https://unpkg.com/lucide@0.468.0"></script>
</head>
<body>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <span class="logo"><img src="images/logo-app.png" alt="Booth Buddy" width="40" height="40"></span>
      <div>
        <span class="word">Booth Buddy</span>
        <span class="sub">Help center</span>
      </div>
    </div>
    <div class="search-wrap">
      <i data-lucide="search" class="ui-icon search-ic soft"></i>
      <input type="text" id="navSearch" placeholder="Search help pages...">
    </div>
    <nav id="navList"></nav>
  </aside>

  <div class="main">
    <div class="mobilebar">
      <button class="menu-toggle" id="menuToggle" aria-label="Open menu"><i data-lucide="menu" class="ui-icon"></i></button>
      <span class="brand" style="padding:0;"><span class="logo"><img src="images/logo-app.png" alt="" width="28" height="28"></span><span class="word" style="font-size:16px;">Booth Buddy Help</span></span>
      <span style="width:40px;"></span>
    </div>
    <div id="pageRoot"></div>
  </div>
</div>

<div class="modal-overlay" id="glossaryModal">
  <div class="modal-card">
    <div class="modal-head">
      <h2><i data-lucide="book-open" class="ui-icon"></i> Words we use</h2>
      <button class="modal-close" id="glossaryClose" aria-label="Close"><i data-lucide="x" class="ui-icon"></i></button>
    </div>
    <div id="glossaryList"></div>
  </div>
</div>

<script>
/* ============ helpers ============ */
function icon(name, size, extraClass){
  size = size || 22;
  if(name === 'brand') return brandMark(size, extraClass);
  var cls = 'ui-icon' + (extraClass ? ' ' + extraClass : '');
  return '<i data-lucide="' + name + '" class="' + cls + '" style="width:' + size + 'px;height:' + size + 'px;"></i>';
}
function brandMark(size, extraClass){
  size = size || 22;
  var cls = 'brand-mark' + (extraClass ? ' ' + extraClass : '');
  return '<img class="' + cls + '" src="images/logo-app.png" alt="" width="' + size + '" height="' + size + '" style="width:' + size + 'px;height:' + size + 'px;">';
}
function refreshIcons(){
  if(window.lucide && typeof lucide.createIcons === 'function'){
    lucide.createIcons({ attrs: { 'stroke-width': 2.5 } });
  }
}
function steps(items){
  return '<ol class="steps">' + items.map(function(s){
    var text = typeof s === 'string' ? s : s.text;
    var note = typeof s === 'object' && s.note ? '<span class="note">' + s.note + '</span>' : '';
    return '<li><span class="num"></span><span class="txt">' + text + note + '</span></li>';
  }).join('') + '</ol>';
}
function callout(type, iconName, html){
  return '<div class="callout callout-' + type + '"><span class="ic">' + icon(iconName, 20) + '</span><div>' + html + '</div></div>';
}
function tip(html){ return callout('tip','lightbulb',html); }
function warn(html){ return callout('warn','triangle-alert',html); }
function info(html){ return callout('info','info',html); }
function soon(html){ return callout('soon','clock',html); }
function pill(cls, html){ return '<span class="pill-btn ' + cls + '">' + html + '</span>'; }
function rows(items){
  return '<div class="rows">' + items.map(function(r){
    return '<div class="row-item"><span class="r-ic">' + icon(r.ic, 20) + '</span><div class="r-body"><div class="r-title">' + r.title + '</div><div class="r-desc">' + r.desc + '</div></div></div>';
  }).join('') + '</div>';
}
function linkGrid(items){
  return '<div class="link-grid">' + items.map(function(l){
    return '<a class="link-card" href="#/' + l.href + '"><div class="lc-top"><span class="lc-ic">' + icon(l.ic, 22) + '</span><span class="lc-title">' + l.title + '</span></div><div class="lc-desc">' + l.desc + '</div></a>';
  }).join('') + '</div>';
}
function faqList(items){
  return '<div class="faq-list">' + items.map(function(f){
    return '<a href="#/' + f.href + '">' + icon(f.ic, 20) + ' ' + f.title + '<span class="chev">' + icon('chevron-right', 18, 'soft') + '</span></a>';
  }).join('') + '</div>';
}
function sectionHead(iconName, title){
  return '<div class="section-audience-head">' + icon(iconName, 22) + '<h2>' + title + '</h2></div>';
}

/* ============ glossary data ============ */
var GLOSSARY = [
  {term:'Market Day', def:'One fair or booth day — a named selling day with a date.'},
  {term:'Events', def:'Owner tab for the active Market Day, Today’s Menu, Past Events, and ending the day.'},
  {term:'Running Tab', def:'Sales made when no Market Day is open (porch or one-offs). Always available.'},
  {term:'Menu', def:'What you are selling today (icon or photo, name, price).'},
  {term:'Inventory', def:'The full list of items the shop can sell (owners manage this).'},
  {term:'Cart', def:'What the customer is buying right now.'},
  {term:'Invoice #', def:'The order number for this sale (#1, #2, #3…).'},
  {term:'Sale name', def:'Optional label for a sale (for example, a customer name).'},
  {term:'Sale notes', def:'Optional note on a sale — not shown on staff screens.'},
  {term:'Complete date', def:'When a preorder should be ready for pickup.'},
  {term:'Pass Code', def:'4-digit owner password that unlocks Events, Inventory, Preorders, Sales, and Settings.'},
  {term:'Sold out', def:'Still on the menu, but you cannot add it to a sale today.'},
  {term:'Preorder', def:'A sale for later pickup. Payment at creation is always Pay on pickup; Cash or Venmo/Zelle is recorded when marked complete.'},
  {term:'+ Pre-order', def:'Button on Home to start a preorder (uses the full catalog, not only today’s Menu).'},
  {term:'Cancel sale', def:'Owner action that keeps a completed sale visible with its Invoice #, marks it Cancelled with a reason, and excludes it from money totals.'},
  {term:'Cancelled', def:'A completed sale the owner cancelled. Still in lists and CSV for history; not counted in revenue or tips.'},
  {term:'Archive', def:'Hide an item from the menu while keeping old sales that used it. Prefer Archive over Delete when an item has past sales.'}
];

/* ============ render ============ */
function tagHtml(a){
  if(a==='staff') return '<span class="tag tag-staff">STAFF</span>';
  if(a==='owner') return '<span class="tag tag-owner">OWNER</span>';
  return '<span class="tag tag-everyone">ALL</span>';
}
function badgeHtml(a){
  if(a==='staff') return '<span class="audience-badge staff">' + icon('shopping-cart', 14) + ' For staff</span>';
  if(a==='owner') return '<span class="audience-badge owner">' + icon('settings', 14) + ' For owners</span>';
  return '<span class="audience-badge everyone">' + icon('users', 14) + ' Everyone</span>';
}

function renderNav(currentHref, filterText){
  filterText = (filterText||'').toLowerCase().trim();
  var html = '';
  NAV.forEach(function(entry){
    if(entry.kind === 'link'){
      if(filterText && entry.title.toLowerCase().indexOf(filterText) === -1) return;
      var active = entry.href === currentHref ? ' active' : '';
      html += '<a class="navlink' + active + '" href="#/' + entry.href + '"><span class="ic">' + icon(entry.ic, 20) + '</span>' + entry.title + '</a>';
    } else if(entry.kind === 'group'){
      var items = entry.items.filter(function(it){ return !filterText || it.title.toLowerCase().indexOf(filterText) > -1; });
      if(!items.length) return;
      html += '<div class="navgroup"><div class="navgroup-title">' + icon(entry.titleIcon, 16) + ' ' + entry.title + '</div>';
      items.forEach(function(it){
        var active = it.href === currentHref ? ' active' : '';
        html += '<a class="navlink' + active + '" href="#/' + it.href + '"><span class="ic">' + icon(it.ic, 20) + '</span>' + it.title + '</a>';
      });
      html += '</div>';
    } else if(entry.kind === 'faqgroup'){
      var fitems = entry.items.filter(function(it){ return !filterText || it.title.toLowerCase().indexOf(filterText) > -1; });
      var indexMatch = !filterText || entry.title.toLowerCase().indexOf(filterText) > -1;
      if(!fitems.length && !indexMatch) return;
      var isOpenBySearch = !!filterText;
      var currentInGroup = currentHref === entry.href || fitems.some(function(it){return it.href===currentHref;}) || entry.items.some(function(it){return it.href===currentHref;});
      var open = isOpenBySearch || currentInGroup;
      html += '<div class="navgroup">';
      var activeIndex = entry.href === currentHref ? ' active' : '';
      html += '<a class="navlink' + activeIndex + '" href="#/' + entry.href + '"><span class="ic">' + icon(entry.titleIcon, 20) + '</span>' + entry.title + '<span class="chev" style="margin-left:auto;">' + icon(open ? 'chevron-down' : 'chevron-right', 14, 'soft') + '</span></a>';
      html += '<div class="faq-sub' + (open?' open':'') + '">';
      (filterText ? fitems : entry.items).forEach(function(it){
        var active = it.href === currentHref ? ' active' : '';
        html += '<a class="navlink' + active + '" href="#/' + it.href + '" style="font-size:12.5px;"><span class="ic">' + icon(it.ic, 18) + '</span>' + it.title + '</a>';
      });
      html += '</div></div>';
    }
  });
  document.getElementById('navList').innerHTML = html;
  refreshIcons();
}

function crumbTrail(page, slug){
  if(slug === 'home') return '';
  var parts = ['<a href="#/home">' + brandMark(14) + ' Home</a>'];
  if(slug.indexOf('faq/') === 0 || slug === 'faq'){
    parts.push('<a href="#/faq">' + icon('circle-help', 14) + ' FAQ</a>');
    if(slug !== 'faq') parts.push(page.crumb);
  } else {
    parts.push(page.crumb);
  }
  return '<div class="crumbs">' + parts.join(' &nbsp;/&nbsp; ') + '</div>';
}

function renderChecklist(){
  var data = {
    chkA: [icon('settings', 16) + ' → Pass Code → Events → enter Market Day name + Date → Start Market Day', 'Check Today’s Menu (sold out / remove items)', 'Hand device to staff'],
    chkB: [icon('shopping-cart', 16) + ' Make a Sale → cart → Checkout → pay → Sold!'],
    chkC: [icon('settings', 16) + ' → Events → review sales & profit', 'End Market Day', '(Optional) Past Events → export CSV for Excel']
  };
  Object.keys(data).forEach(function(id){
    var el = document.getElementById(id);
    if(!el) return;
    el.innerHTML = data[id].map(function(label, i){
      return '<div class="chk-row" data-idx="' + id + i + '"><span class="chk-box"></span><span class="chk-label">' + label + '</span></div>';
    }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chk-row'), function(row){
      row.addEventListener('click', function(){
        row.classList.toggle('done');
        row.querySelector('.chk-box').innerHTML = row.classList.contains('done') ? icon('check', 14) : '';
        refreshIcons();
      });
    });
  });
}

function renderPage(){
  var hash = window.location.hash.replace(/^#\/?/, '') || 'home';
  var page = PAGES[hash];
  if(!page){ page = PAGES['home']; hash = 'home'; }

  var headBadge = hash === 'home' ? '' : '<div class="badge-row">' + badgeHtml(page.audience) + '</div>';
  var head = hash === 'home' ? '' :
    '<div class="page-head"><span class="emoji">' + icon(page.icon, 26) + '</span><div><h1>' + page.title + '</h1>' + headBadge + '</div></div>';

  var html = crumbTrail(page, hash) + head + page.body;
  html += '<div class="footer-nav"><div class="fn-left">' +
    '<button class="glossary-link" onclick="openGlossary()">' + icon('book-open', 18) + ' Words we use</button>' +
    (hash !== 'home' ? '<a class="glossary-link" href="#/faq">' + icon('circle-help', 18) + ' Browse FAQ</a>' : '') +
    '<a class="glossary-link" href="privacy.html">' + icon('shield', 18) + ' Privacy</a>' +
    '</div>' + (hash !== 'home' ? '<a class="home-link" href="#/home">← Back to Welcome</a>' : '') + '</div>';

  document.getElementById('pageRoot').innerHTML = html;
  renderNav(hash, document.getElementById('navSearch').value);
  if(hash === 'checklist') renderChecklist();
  refreshIcons();
  window.scrollTo(0,0);
  closeSidebar();
}

function openGlossary(){
  document.getElementById('glossaryList').innerHTML = GLOSSARY.map(function(g){
    return '<div class="glossary-row"><div class="term">' + g.term + '</div><div class="def">' + g.def + '</div></div>';
  }).join('');
  document.getElementById('glossaryModal').classList.add('open');
  refreshIcons();
}
function closeGlossary(){ document.getElementById('glossaryModal').classList.remove('open'); }

function openSidebar(){ document.getElementById('sidebar').classList.add('open'); refreshIcons(); }
function closeSidebar(){ document.getElementById('sidebar').classList.remove('open'); }

document.getElementById('glossaryClose').addEventListener('click', closeGlossary);
document.getElementById('glossaryModal').addEventListener('click', function(e){ if(e.target === this) closeGlossary(); });
document.getElementById('menuToggle').addEventListener('click', function(){
  var sb = document.getElementById('sidebar');
  sb.classList.contains('open') ? closeSidebar() : openSidebar();
});
document.getElementById('navSearch').addEventListener('input', function(){
  var hash = window.location.hash.replace(/^#\/?/, '') || 'home';
  renderNav(hash, this.value);
});

window.addEventListener('hashchange', renderPage);
window.addEventListener('DOMContentLoaded', function(){ renderPage(); refreshIcons(); });
renderPage();
</script>
